<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: monospace;
            padding: 24px;
            background: -moz-linear-gradient(rgb 0,0,0.1 red);
            color: #000;
        }
        h1{
            text-align: center;
            margin-bottom: 24px;
    
        }
        .calendar{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }
    
        table{
            border-collapse: collapse;
            background: floralwhite;
            border: 1px solid darkgreen;
            width: 70%;
            height: 50vh;
        }
        caption{
            font-weight: bold;
            padding: 6px;
            border: 1px solid darkorange;
            border-bottom: none;
            background: fuchsia;
        }
        th ,td{
            width: 26px;
            height: 26px;
            text-align: center;
            font-size: 12px;
    
        }
        th{
            color: #000;
            border-bottom: 2px solid;
        }
        
    
    
    </style>
</head>
<body>
    <h1>2026</h1>
    <div class="calender">
        <table>
            <caption>January</caption>
            <thead>
                <tr>
                    <th>S</th>
                    <th>M</th>
                    <th>T</th>
                    <th>W</th>
                    <th>T</th>
                    <th>F</th>
                    <th>S</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>1</td>
                    <td>2</td>
                    <td>3</td>
                    <td>4</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>6</td>
                    <td>7</td>
                    <td>8</td>
                    <td>9</td>
                    <td>10</td>
                    <td>11</td>
                </tr>
                <tr>
                    <td>12</td>
                    <td>13</td>
                    <td>14</td>
                    <td>15</td>
                    <td>16</td>
                    <td>17</td>
                    <td>18</td>
                </tr>
                <tr>
                    <td>19</td>
                    <td>20</td>
                    <td>21</td>
                    <td>22</td>
                    <td>23</td>
                    <td>24</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>26</td>
                    <td>27</td>
                    <td>28</td>
                    <td>29</td>
                    <td>30</td>
                    <td>31</td>
                    <td>32</td>
                </tr>
            </tbody>
        </table>

    </div>
    
</body>
</html>
